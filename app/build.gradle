plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace = 'com.neonhud.app'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.neonhud.app'
        minSdk = 26
        targetSdk = 36
        versionCode = 2
        versionName = '2.0'

        // Gemma 4 E2B runs on 64-bit ARM phones; dropping x86/armv7 native libs keeps the APK small.
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packaging {
        jniLibs { useLegacyPackaging = false }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Google's on-device LLM runtime for .litertlm models (Gemma 4 E2B). The only dependency added.
    implementation 'com.google.ai.edge.litertlm:litertlm-android:latest.release'
}
