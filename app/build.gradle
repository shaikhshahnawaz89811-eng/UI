plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace = 'com.neonhud.app'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.neonhud.app'
        minSdk = 26
        targetSdk = 36
        versionCode = 3
        versionName = '2.1'

        // Gemma 4 E2B and the Qwen2.5-Coder GGUF (llama.cpp AAR) both run on 64-bit ARM phones; dropping x86/armv7 keeps the APK small.
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packaging {
        jniLibs { useLegacyPackaging = false }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Google's on-device LLM runtime for .litertlm models (Gemma 4 E2B).
    implementation 'com.google.ai.edge.litertlm:litertlm-android:latest.release'

    // Prebuilt llama.cpp for Android (Maven Central, arm64-v8a): runs the Qwen2.5-Coder GGUF. Its heavy calls are
    // suspend functions, so CoderEngine drives them with runBlocking from the module / chat worker threads.
    implementation 'dev.ffmpegkit-maintained:llama-android:0.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
