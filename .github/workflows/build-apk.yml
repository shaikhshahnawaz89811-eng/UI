name: Build APK

on:
  push:
  workflow_dispatch:   # lets you start a build manually from the Actions tab

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # JDK 21: the LiteRT-LM library is compiled to Java 21 bytecode; the app itself still targets Java 17.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python for Office artifact validation
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Office artifact validators
        run: python -m pip install python-docx openpyxl python-pptx

      # No Gradle wrapper in the repo: this installs the exact Gradle the project needs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.4'
          cache-provider: basic

      - name: Run JVM regression gate
        run: bash jvm-tests/run-tests.sh

      - name: Run Android/source wiring sanity gate
        run: bash jvm-tests/check-stage4-source.sh

      - name: Run Stage 4 deep write and artifact validation
        run: bash jvm-tests/run-stage4-deep.sh

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      # 1) The raw .apk itself (not zipped) - download it on the phone and tap it to install.
      #    archive:false uploads exactly one file, so the path must point at that file.
      - name: Upload APK (plain file, no zip)
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error

      # 2) Same APK inside a zip, as a fallback.
      - name: Upload APK (zip)
        uses: actions/upload-artifact@v7
        with:
          name: neon-hud-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
