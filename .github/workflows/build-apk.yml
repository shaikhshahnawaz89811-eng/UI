name: Build APK

on:
  push:
  workflow_dispatch:   # lets you start a build manually from the Actions tab

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # JDK 21: the LiteRT-LM library is compiled to Java 21 bytecode; the app itself still targets Java 17.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # No Gradle wrapper in the repo: this installs the exact Gradle the project needs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Build debug + release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      # 1) The raw debug .apk itself (not zipped) - download it on the phone and tap it to install.
      #    archive:false uploads exactly one file, so the path must point at that file.
      - name: Upload APK (plain file, no zip)
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error

      # 2) Same debug APK inside a zip, as a fallback.
      - name: Upload debug APK (zip)
        uses: actions/upload-artifact@v7
        with:
          name: neon-hud-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 3) Release variant (unsigned unless signing is configured by the project owner).
      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: neon-hud-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
