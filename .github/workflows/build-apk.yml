name: Build APK

on:
  push:
  workflow_dispatch:   # lets you start a build manually from the Actions tab

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # JDK 21: the LiteRT-LM library is compiled to Java 21 bytecode; the app itself still targets Java 17.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # No Gradle wrapper in the repo: this installs the exact Gradle the project needs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: neon-hud-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
